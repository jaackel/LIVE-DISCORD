<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0b0d12">
<title>Live Sitevision</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="join">
  <form id="joinForm">
    <div class="logo"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></div>
    <h1>Entrar na live</h1>
    <p class="sub">Sem cadastro. Digite seu nome e a sala, e pronto.</p>
    <label>Seu nome <input id="name" required maxlength="40" autocomplete="name" placeholder="Como quer aparecer"></label>
    <label>Sala <input id="room" required maxlength="60" placeholder="ex: reuniao"></label>
    <button class="primary">Entrar</button>
    <p class="err" id="joinErr"></p>
  </form>
</main>

<section id="stage" hidden>
  <header id="top">
    <div class="brand"><span class="dot"></span><span id="roomName"></span></div>
    <div id="dock" class="seg" title="Onde ficam as câmeras quando alguém está transmitindo a tela">
      <span>Câmeras</span>
      <button data-dock="bottom">Embaixo</button><button data-dock="top">Em cima</button><button data-dock="left">Esquerda</button><button data-dock="right">Direita</button><button data-dock="float">Flutuando</button>
    </div>
    <button id="btnSound" class="ghost" title="Sons de entrada e saída">
      <svg id="icoSound" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>Sons</span>
    </button>
    <button id="btnCopy" class="ghost" title="Copiar link da sala">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span>Copiar link</span>
    </button>
  </header>

  <div id="main">
    <div id="grid"><div id="spot"></div><div id="strip"></div></div>
    <aside id="users"><h2>Na sala <span id="count"></span></h2><ul id="userList"></ul></aside>
  </div>

  <footer id="bar">
    <button id="btnMic" class="ctl-btn" title="Microfone">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      <span>Microfone</span>
    </button>
    <button id="btnCam" class="ctl-btn" title="Câmera">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg>
      <span>Câmera</span>
    </button>
    <button id="btnScreen" class="ctl-btn" title="Compartilhar tela">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Compartilhar tela</span>
    </button>
    <label class="chk" title="Inclui o som do computador na transmissão"><input type="checkbox" id="shareAudio" checked><span>Áudio da tela</span></label>
    <label class="qual">
      <span>Qualidade da tela</span>
      <select id="quality">
        <option value="eco">Econômica · 720p 15fps</option>
        <option value="balanced" selected>Equilibrada · 1080p 30fps</option>
        <option value="max">Máxima · 4K 60fps</option>
      </select>
    </label>
    <button id="btnLeave" class="ctl-btn danger" title="Sair da sala">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Sair</span>
    </button>
  </footer>
</section>
<script src="/vendor/livekit-client.js"></script>
<script src="app.js"></script>
</body>
</html>
